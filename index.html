<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reasongine Observatory</title>
<style>
:root{--ink:#202827;--muted:#68736f;--line:#dce3df;--paper:#fff;--wash:#f3f6f4;--green:#176b54;--soft:#e7f2ec;--amber:#8c5e17;--red:#a4483b}
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}a{color:var(--green)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #70b898;outline-offset:2px}header{background:#202b27;color:white;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}header h1{font-size:19px;line-height:1.2;margin:0;font-weight:650}header span{color:#b9c9c0;font-size:12px}header a{color:#d5e7de;font-size:12px;text-decoration:none}main{max-width:1600px;margin:auto;padding:22px 28px 30px}.run-header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.eyebrow{color:var(--muted);font-size:12px;margin:0 0 3px}.run-header h2{font-size:24px;line-height:1.3;margin:0;font-weight:650}.run-picker{min-width:240px;max-width:100%}label{display:block;color:var(--muted);font-size:12px}select,input{border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink);padding:9px 11px;width:100%}.stats{display:flex;gap:40px;flex-wrap:wrap;padding:18px 0 15px;border-bottom:1px solid var(--line);margin-bottom:12px}.stat small{display:block;font-size:11px;color:var(--muted)}.stat b{font:600 20px/1.5 ui-monospace,monospace}.notice{font-size:12px;color:var(--muted);margin:0 0 16px;max-width:1100px}.workspace{display:grid;grid-template-columns:340px minmax(0,1fr);border-top:1px solid var(--line);min-height:650px;background:white}.list-pane{border-right:1px solid var(--line);padding:16px 0;min-width:0}.list-tools{padding:0 16px 14px;display:grid;gap:9px}.list-heading{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.hyp-list{max-height:calc(100vh - 350px);min-height:310px;overflow:auto}.hyp-row{width:100%;text-align:left;background:white;border:0;border-bottom:1px solid #e9eeeb;padding:13px 16px;display:grid;grid-template-columns:27px minmax(0,1fr) 53px;gap:8px;align-items:start;color:inherit;min-height:89px}.hyp-row:hover{background:var(--wash)}.hyp-row.selected{background:var(--soft);box-shadow:inset 3px 0 var(--green)}.rank{color:var(--muted);font:12px/1.8 ui-monospace,monospace}.row-title{font-size:13px;font-weight:550;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.row-meta{font-size:11px;color:var(--muted);margin-top:5px}.row-score{text-align:right;font:600 13px/1.5 ui-monospace,monospace;color:var(--green)}.list-footer{padding:12px 16px;font-size:11px;color:var(--muted)}.detail{padding:22px 28px 32px;min-width:0}.detail-header{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}.detail h2{font-size:20px;line-height:1.45;font-weight:650;margin:7px 0 16px;overflow-wrap:anywhere}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:22px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--muted);font-weight:550;white-space:nowrap}.tabs button.active{color:var(--green);border-color:var(--green)}.reading{max-height:calc(100vh - 395px);min-height:350px;overflow:auto;padding-right:8px;overflow-wrap:anywhere}.claim{font-size:15px;line-height:1.8;margin:0 0 24px;max-width:80ch}.section-title{font-size:13px;font-weight:650;margin:22px 0 10px}.score-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:12px 0 8px}.score-item .labels{display:flex;justify-content:space-between;font-size:12px}.score-item b{font-family:ui-monospace,monospace}.track{height:7px;background:#e7ebe8;position:relative;margin:10px 0 6px}.fill{height:100%;background:var(--green)}.tick{position:absolute;top:-3px;width:2px;height:13px;background:var(--amber)}.score-item small{font-size:11px;color:var(--muted)}.numbers{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:20px 0}.numbers strong{color:var(--ink);font-family:ui-monospace,monospace}.mechanism{padding-left:23px}.mechanism li{padding:0 0 12px 5px;line-height:1.7}.fold{border-top:1px solid var(--line);padding:12px 0}.fold>summary{cursor:pointer;font-weight:550;font-size:13px}.fold li{margin-bottom:8px}.stage-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.stage-stats{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}.subtabs{display:flex;gap:2px;background:var(--wash);padding:3px;border-radius:5px}.subtabs button{border:0;background:transparent;border-radius:3px;padding:5px 9px;font-size:12px;color:var(--muted)}.subtabs button.active{background:white;color:var(--ink);box-shadow:0 1px 3px #0001}.markdown{font-size:14px;line-height:1.75;max-width:90ch}.markdown h1{font-size:19px}.markdown h2{font-size:17px;margin:22px 0 10px}.markdown h3{font-size:15px}.markdown pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--wash);padding:12px;border-radius:4px;font-size:12px}.markdown code{font-size:12px}.markdown table{display:block;overflow-x:auto;width:100%;border-collapse:collapse;font-size:12px}.markdown td,.markdown th{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;min-width:85px}.markdown img{max-width:100%}.markdown blockquote{border-left:3px solid var(--line);margin-left:0;padding-left:14px;color:var(--muted)}.activity{list-style:none;padding:0;margin:0}.activity li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;border-bottom:1px solid var(--line);padding:12px 0;font-size:13px}.activity .tool{font-size:11px;color:var(--muted)}.activity .error{color:var(--red)}.source{border-bottom:1px solid var(--line);padding:14px 0}.source a{font-weight:550;text-decoration:none}.source p{font-size:13px;color:var(--muted);margin:5px 0}.empty{padding:40px 12px;color:var(--muted);text-align:center}.trace-note{font-size:11px;color:var(--muted);margin:0 0 14px}.bottom{margin-top:15px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.mobile-back{display:none}.sort{font-size:12px;padding:5px 7px;width:140px}.score-caption{font-size:11px;color:var(--muted)}
@media(min-width:1700px){.workspace{grid-template-columns:390px minmax(0,1fr)}}
@media(max-width:760px){header{padding:14px 18px}header span{display:none}main{padding:18px 14px}.run-header{align-items:stretch;flex-direction:column;gap:13px}.run-header h2{font-size:21px}.run-picker{min-width:0}.stats{gap:22px;padding:14px 0}.stat b{font-size:17px}.workspace{display:block;min-height:0}.list-pane{border-right:0}.hyp-list{max-height:none}.detail{padding:16px}.reading{max-height:none;min-height:0;padding:0}.workspace.detail-open .list-pane{display:none}.workspace:not(.detail-open) .detail{display:none}.mobile-back{display:block;border:0;background:none;color:var(--green);padding:0 0 16px;font-size:13px}.tabs{gap:20px}.detail h2{font-size:18px}.score-grid{gap:12px}.stage-top{align-items:flex-start;flex-direction:column}.bottom{flex-direction:column}.notice{font-size:11px}}
</style>
</head>
<body>
<header><div><h1>Reasongine Observatory</h1><span>APOE4 / APOE3 · Microglia</span></div><nav aria-label="Pages" style="display:flex;gap:20px;flex-wrap:wrap"><a href="hypotheses/">Hypotheses &amp; scores</a><a href="https://github.com/ParsaIdp/reasongine-observatory" target="_blank" rel="noopener">Public snapshot</a></nav></header>
<main>
<div class="run-header"><div><p class="eyebrow" id="run-model"></p><h2 id="run-title"></h2></div><div class="run-picker"><label for="run-select">Experiment run</label><select id="run-select"></select></div></div>
<div class="stats" id="stats"></div><p class="notice" id="notice"></p>
<div class="workspace" id="workspace"><aside class="list-pane"><div class="list-tools"><div class="list-heading"><span id="list-count">Hypotheses</span><select class="sort" id="sort" aria-label="Sort hypotheses"><option value="cosine">Best cosine</option><option value="lipid">Best lipid cosine</option><option value="cost">Lowest cost</option></select></div><input id="search" aria-label="Search hypotheses" placeholder="Search hypotheses"></div><div class="hyp-list" id="hyp-list"></div><div class="list-footer">Scores compare predictions with held-out measurements.</div></aside><section class="detail"><button class="mobile-back" id="back">Back to hypotheses</button><div class="detail-header" id="detail-meta"></div><h2 id="hyp-title"></h2><nav class="tabs" id="tabs" aria-label="Hypothesis views"></nav><div class="reading" id="reading"></div></section></div>
<footer class="bottom"><span id="snapshot-count"></span><span>Scientific hypotheses are proposals, not causal proof.</span></footer>
</main>
<script src="snapshot.js"></script><script src="marked.umd.js"></script><script src="purify.min.js"></script>
<script>
'use strict';
const data=window.OBSERVATORY_SNAPSHOT, $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,n=3)=>typeof v==='number'?v.toFixed(n):'—', money=v=>typeof v==='number'?'$'+v.toFixed(2):'—', pct=v=>typeof v==='number'?(100*v).toFixed(1)+'%':'—';
const duration=ms=>typeof ms==='number'?Math.round(ms/60000)+' min':'—';
const names={'Opus-literature-9':'Opus · Literature batch','Opus-literature-pilot':'Opus · Literature pilot','Opus-earlier-10':'Opus · Earlier batch','Sonnet-literature-6':'Sonnet · Literature batch','Sonnet-literature-pilot':'Sonnet · Literature pilot','Sonnet-earlier-10':'Sonnet · Earlier batch'};
let run=data.runs[0].name, selected=null, tab='hypothesis', subtab='analysis';
const detail=()=>data.details[run], score=id=>detail().scores.find(s=>s.hypothesis_id===id)||{}, rank=id=>detail().ranked.find(r=>r.hypothesis_id===id)||{}, base=()=>Object.values(detail().baselines||{})[0]||{};
function title(name){const key=name.split('/').pop();return names[key]||key.replaceAll('-',' ')}
function rows(){let result=detail().hypotheses.filter(h=>(h.title+' '+h.claim).toLowerCase().includes($('#search').value.toLowerCase())); const sort=$('#sort').value; return result.sort((a,b)=>sort==='cost'?(rank(a.hypothesis_id).cost_usd??Infinity)-(rank(b.hypothesis_id).cost_usd??Infinity):sort==='lipid'?(score(b.hypothesis_id).by_modality?.lipid_abundance?.cosine_similarity??-1)-(score(a.hypothesis_id).by_modality?.lipid_abundance?.cosine_similarity??-1):(score(b.hypothesis_id).cosine_similarity??-1)-(score(a.hypothesis_id).cosine_similarity??-1));}
function renderList(){const items=rows(); $('#list-count').textContent=items.length+' hypotheses';$('#hyp-list').innerHTML=items.length?items.map(h=>{const id=h.hypothesis_id,r=rank(id),s=score(id);return `<button class="hyp-row ${id===selected?'selected':''}" data-id="${esc(id)}" aria-pressed="${id===selected}"><span class="rank">${r.rank?'#'+r.rank:'·'}</span><div><div class="row-title">${esc(h.title)}</div><div class="row-meta">${esc(id)}${typeof r.cost_usd==='number'?' · '+money(r.cost_usd):''}</div></div><span class="row-score">${num(s.cosine_similarity)}</span></button>`}).join(''):'<div class="empty">No matching hypotheses</div>'; document.querySelectorAll('.hyp-row').forEach(el=>el.onclick=()=>{selected=el.dataset.id;$('#workspace').classList.add('detail-open');saveHash();renderList();renderDetail()});}
function saveHash(){history.replaceState(null,'','#'+run+'/'+selected+'/'+tab)}
function renderRun(){const d=detail(),s=d.summary;$('#run-select').value=run;$('#run-title').textContent=title(run);$('#run-model').textContent=(s.model_id||'Model not recorded')+' · '+(s.effort||'standard')+' effort';$('#stats').innerHTML=[['Scored',d.scores.length],['Best cosine',num(s.best_cosine)],['Baseline cosine',num(base().cosine_similarity)],['Run cost',money(s.cost_usd)]].map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('');$('#notice').textContent=d.manifest.evaluation_note||'';if(!d.hypotheses.some(h=>h.hypothesis_id===selected))selected=rows()[0]?.hypothesis_id;renderList();renderDetail();}
function renderDetail(){const d=detail(),h=d.hypotheses.find(h=>h.hypothesis_id===selected); if(!h){$('#reading').innerHTML='<div class="empty">No hypothesis selected</div>';return}$('#detail-meta').textContent=(rank(selected).rank?'Rank '+rank(selected).rank+' · ':'')+selected;$('#hyp-title').textContent=h.title;$('#tabs').innerHTML=[['hypothesis','Hypothesis'],['generator','Generator'],['predictor','Predictor']].map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}" aria-selected="${tab===id}">${label}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;subtab='analysis';saveHash();renderDetail()});$('#reading').scrollTop=0;if(tab==='hypothesis')renderHypothesis(h);else renderTrace();}
function list(v){return '<ol class="mechanism">'+(v||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'}
function renderHypothesis(h){const s=score(selected),b=base();$('#reading').innerHTML=`<p class="claim">${esc(h.claim)}</p><div class="section-title">Held-out cosine similarity</div><div class="score-grid">${[['gene_expression','RNA'],['protein_abundance','Protein'],['lipid_abundance','Lipid']].map(([key,label])=>{const v=s.by_modality?.[key]?.cosine_similarity,bv=b.by_modality?.[key]?.cosine_similarity;return `<div class="score-item"><div class="labels"><span>${label}</span><b>${num(v)}</b></div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,(v||0)*100))}%"></div>${typeof bv==='number'?`<span class="tick" style="left:${Math.max(0,Math.min(100,bv*100))}%" title="Baseline ${num(bv)}"></span>`:''}</div><small>${typeof bv==='number'?'Baseline '+num(bv):'Baseline unavailable'}</small></div>`}).join('')}</div><div class="numbers"><span>Direction <strong>${pct(s.direction_accuracy)}</strong></span><span>Balanced direction <strong>${pct(s.balanced_direction_accuracy)}</strong></span><span>MAE <strong>${num(s.mean_absolute_error)}</strong></span></div><div class="section-title">Proposed mechanism</div>${list(h.mechanism_steps)}<details class="fold"><summary>Assumptions · ${(h.assumptions||[]).length}</summary>${list(h.assumptions)}</details><details class="fold"><summary>Falsifiable predictions · ${(h.falsifiable_predictions||[]).length}</summary>${list(h.falsifiable_predictions)}</details>`;}
function renderTrace(){const trace=detail().traces?.[selected]?.[tab];if(!trace?.available){$('#reading').innerHTML='<div class="empty">No archived trace is available for this stage.</div>';return}$('#reading').innerHTML=`<div class="stage-top"><div class="stage-stats"><span>${duration(trace.duration_ms)}</span><span>${money(trace.cost_usd)}</span><span>${trace.turns??'—'} turns</span><span>${trace.steps.length} tool calls</span></div><div class="subtabs">${['analysis','activity','sources'].map(t=>`<button class="${subtab===t?'active':''}" data-subtab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div><p class="trace-note">Public trace: tool activity and final analysis. Raw reasoning and tool payloads are omitted.</p><div id="trace-body"></div>`;document.querySelectorAll('[data-subtab]').forEach(b=>b.onclick=()=>{subtab=b.dataset.subtab;renderTrace()});const body=$('#trace-body');if(subtab==='activity'){body.innerHTML='<ol class="activity">'+trace.steps.map((s,i)=>`<li><span class="rank">${i+1}</span><div>${esc(s.title)}<div class="tool">${esc(s.tool)}</div></div><span class="${s.is_error?'error':'tool'}">${s.is_error?'Error':s.is_error===false?'Completed':''}</span></li>`).join('')+'</ol>';return}if(subtab==='sources'){body.innerHTML=trace.sources.length?trace.sources.map(s=>`<div class="source"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><p>${esc(s.used_for)}</p></div>`).join(''):'<div class="empty">No source ledger recorded.</div>';return}body.className='markdown';body.innerHTML=DOMPurify.sanitize(marked.parse(trace.analysis||trace.completion||'No written analysis was archived.'),{FORBID_TAGS:['img','style','form','input','button','iframe']});body.querySelectorAll('a').forEach(a=>{if(!/^https?:\/\//.test(a.getAttribute('href')||''))a.removeAttribute('href');else{a.target='_blank';a.rel='noopener noreferrer'}});}
$('#run-select').innerHTML=data.runs.map(r=>`<option value="${esc(r.name)}">${esc(title(r.name))} · ${r.n_scored} hypotheses</option>`).join('');$('#run-select').onchange=()=>{run=$('#run-select').value;selected=null;$('#search').value='';$('#workspace').classList.remove('detail-open');renderRun();saveHash()};$('#search').oninput=renderList;$('#sort').onchange=renderList;$('#back').onclick=()=>$('#workspace').classList.remove('detail-open');$('#snapshot-count').textContent=data.runs.reduce((n,r)=>n+r.n_scored,0)+' hypotheses · '+data.runs.length+' runs';
const hash=location.hash.slice(1).split('/');if(hash.length>=2&&data.details[hash.slice(0,2).join('/')]){run=hash.slice(0,2).join('/');selected=hash[2]||null;if(['generator','predictor','hypothesis'].includes(hash[3]))tab=hash[3];if(selected)$('#workspace').classList.add('detail-open')}
renderRun();
</script>
</body>
</html>
